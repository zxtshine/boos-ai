<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试问答Agent - 智能面试陪练</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --orange: #f59e0b;
    --red: #ef4444;
    --success-bg: #052e16;
    --danger-bg: #450a0a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .header .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }

  /* Setup */
  .setup-section { display: flex; gap: 12px; flex-wrap: wrap; }
  .setup-section input { flex: 1; min-width: 200px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
  .setup-section input:focus { border-color: var(--accent); }
  .setup-section input::placeholder { color: #64748b; }
  .job-context { margin-top: 12px; padding: 12px; background: #0f172a; border-radius: 8px; font-size: 13px; color: var(--text-muted); line-height: 1.6; display: none; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #475569; }
  .btn-success { background: var(--green); color: black; }
  .btn-danger { background: var(--red); color: white; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }

  /* Interview Panel */
  .interview-panel { display: none; }
  .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .question-meta { display: flex; gap: 8px; align-items: center; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .tag-lang { background: #1e3a5f; color: #93c5fd; }
  .tag-db { background: #14532d; color: #4ade80; }
  .tag-sys { background: #3b0764; color: #c084fc; }
  .tag-eng { background: #1e3a5f; color: #60a5fa; }
  .tag-fe { background: #422006; color: #fbbf24; }
  .tag-ai { background: #450a0a; color: #f87171; }
  .tag-data { background: #052e16; color: #4ade80; }
  .tag-sec { background: #450a0a; color: #f87171; }
  .tag-easy { background: #052e16; color: #4ade80; }
  .tag-medium { background: #422006; color: #fbbf24; }
  .tag-hard { background: #450a0a; color: #f87171; }
  .question-text { font-size: 17px; line-height: 1.7; margin-bottom: 16px; padding: 16px; background: #0f172a; border-radius: 8px; border-left: 3px solid var(--accent); }
  .skills-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .skill-pill { padding: 2px 8px; background: var(--border); border-radius: 4px; font-size: 12px; color: var(--text-muted); }

  /* Answer */
  .answer-area textarea { width: 100%; min-height: 120px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; line-height: 1.6; resize: vertical; outline: none; font-family: inherit; }
  .answer-area textarea:focus { border-color: var(--accent); }
  .answer-area textarea::placeholder { color: #64748b; }
  .answer-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* Grade */
  .grade-panel { display: none; margin-top: 16px; }
  .grade-scores { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .score-card { flex: 1; min-width: 100px; background: #0f172a; border-radius: 8px; padding: 12px; text-align: center; }
  .score-card .value { font-size: 24px; font-weight: 700; }
  .score-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .score-high { color: var(--green); }
  .score-mid { color: var(--orange); }
  .score-low { color: var(--red); }
  .feedback-text { background: #0f172a; border-radius: 8px; padding: 16px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
  .follow-up { margin-top: 12px; }
  .follow-up li { padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); list-style: none; }
  .follow-up li::before { content: "💡 "; }

  /* Review Section */
  .review-section { display: none; }
  .review-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .review-stat { text-align: center; padding: 16px; background: #0f172a; border-radius: 8px; }
  .review-stat .value { font-size: 28px; font-weight: 700; }
  .review-stat .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .review-text { background: #0f172a; border-radius: 8px; padding: 16px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
  .history-item { padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; }
  .history-item .q { color: var(--text); }
  .history-item .s { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* Loading & Progress Bar */
  .loading { display: none; text-align: center; padding: 40px 20px; }
  .loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--text-muted); font-size: 14px; }
  .progress-wrap { width: 100%; max-width: 400px; margin: 16px auto 0; }
  .progress-bar-bg { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #60a5fa); border-radius: 3px; transition: width 0.6s ease; }
  .progress-steps { display: flex; justify-content: space-between; margin-top: 10px; }
  .progress-step { font-size: 11px; color: var(--border); transition: color 0.3s; text-align: center; flex: 1; }
  .progress-step.active { color: var(--accent); font-weight: 500; }
  .progress-step.done { color: var(--green); }

  /* Chat UI */
  .chat-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 300px; max-height: 55vh; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
  .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .chat-bubble.interviewer { align-self: flex-start; background: #0f172a; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .chat-bubble.user { align-self: flex-end; background: #1e3a5f; border: 1px solid #2563eb; border-bottom-right-radius: 4px; }
  .chat-bubble .sender { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .chat-bubble.user .sender { color: #60a5fa; }
  .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input-row textarea { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; line-height: 1.6; resize: none; outline: none; font-family: inherit; min-height: 44px; }
  .chat-input-row textarea:focus { border-color: var(--accent); }
  .chat-input-row textarea::placeholder { color: #64748b; }
  .chat-system-msg { text-align: center; font-size: 12px; color: var(--text-muted); padding: 8px; }

  /* Nav tabs */
  .nav-tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); border-radius: 8px; padding: 4px; }
  .nav-tab { flex: 1; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-muted); transition: all 0.15s; border: none; background: transparent; }
  .nav-tab.active { background: var(--accent); color: white; }
  .nav-tab:hover:not(.active) { background: var(--border); }

  /* Tips */
  .tips-box { margin-top: 8px; padding: 10px 14px; background: #1e3a5f; border-radius: 8px; font-size: 13px; color: #93c5fd; line-height: 1.6; display: none; }

  /* Empty state */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  @media (max-width: 640px) {
    .container { padding: 12px; }
    .grade-scores { flex-direction: column; }
    .score-card { min-width: auto; }
    .question-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>🎯 <span>面试问答</span>Agent</h1>
    <div class="status">
      <span class="dot"></span>
      <span>qwen2.5:14b</span>
    </div>
  </div>

  <!-- Nav Tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('learn')">📖 学习模式</button>
    <button class="nav-tab" onclick="switchTab('interview')">🎙️ 模拟面试</button>
    <button class="nav-tab" onclick="switchTab('review')">📊 面试回顾</button>
  </div>

  <!-- ===== Tab: 学习模式 ===== -->
  <div id="tab-learn">
    <div class="card">
      <div class="card-title">📖 问一个技术问题</div>
      <div class="setup-section">
        <input type="text" id="learn-input" placeholder="例如：什么是分布式事务？React和Vue的区别？" value="">
        <button class="btn btn-primary" onclick="learnAsk()">提问</button>
      </div>
    </div>

    <!-- 结果区 -->
    <div id="learn-result" style="display:none;">
      <div class="card">
        <div class="question-header">
          <span style="font-size:13px;color:var(--text-muted)">💬</span>
          <span id="learn-q" style="font-size:15px;font-weight:500;"></span>
        </div>
        <div id="learn-a" class="question-text" style="border-left-color:var(--green);white-space:pre-wrap;"></div>
        <div id="learn-meta" style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);">
          <span id="learn-category"></span>
          <span id="learn-speed"></span>
          <span id="learn-source"></span>
        </div>
        <div id="learn-followup" style="margin-top:12px;display:none;">
          <div class="card-title" style="margin-bottom:8px;">🔍 相关问题</div>
          <div id="learn-related"></div>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="learn-loading" class="loading">
      <div class="spinner"></div>
      <p id="learn-loading-text">正在搜索答案...</p>
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div id="learn-progress-fill" class="progress-bar-fill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div class="card" style="margin-top:16px;">
      <div class="card-title">💡 试试这些问题</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('什么是分布式事务？')">分布式事务</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('什么是RESTful API？')">RESTful API</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('什么是微服务架构？')">微服务架构</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('什么是数据库索引？')">数据库索引</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('React和Vue有什么区别？')">React vs Vue</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('Docker和K8s的关系？')">Docker & K8s</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('什么是RAG？')">什么是RAG</button>
        <button class="btn btn-secondary btn-sm" onclick="quickAsk('Python装饰器怎么用？')">Python装饰器</button>
      </div>
    </div>
  </div>

  <!-- ===== Tab: 模拟面试 ===== -->
  <div id="tab-interview">

    <!-- Setup -->
    <div id="setup-section" class="card">
      <div class="card-title">🎯 选择面试方向</div>
      <div class="setup-section">
        <input type="text" id="job-focus" placeholder="例如：后端开发、前端开发、数据分析、算法工程师..." value="">
        <button class="btn btn-primary" onclick="startInterview()">开始面试</button>
      </div>
      <div id="job-context" class="job-context"></div>
    </div>

    <!-- Chat Area -->
    <div id="interview-chat" style="display:none;">
      <div class="chat-container" id="chat-messages"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="输入你的回答... (Enter 发送, Shift+Enter 换行)" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="btn btn-primary" id="chat-send-btn" onclick="sendMessage()">发送</button>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn btn-danger btn-sm" onclick="endInterview()">结束面试</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p id="loading-text">正在准备...</p>
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill" style="width:0%"></div>
        </div>

  </div>

  <!-- ===== Tab: 面试回顾 ===== -->
  <div id="tab-review" class="review-section">
    <div id="review-empty" class="empty-state">
      <div class="icon">📊</div>
      <p>还没有面试记录<br>开始一次模拟面试后，这里会显示你的表现分析</p>
    </div>
    <div id="review-content" style="display:none;">
      <!-- 总览统计 -->
      <div class="card">
        <div class="card-title">📈 面试总览</div>
        <div id="review-summary" class="review-summary"></div>
      </div>

      <!-- 类别雷达 + 下次权重 -->
      <div class="card">
        <div class="card-title">🎯 各类别表现 & 下次出题权重</div>
        <div id="category-breakdown" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>

      <!-- 薄弱题目列表 -->
      <div id="weak-areas" class="card">
        <div class="card-title">⚠️ 得分最低的题目</div>
        <div id="weak-list"></div>
      </div>

      <!-- 历史会话列表 -->
      <div class="card">
        <div class="card-title">📋 历史面试记录</div>
        <div id="sessions-list"></div>
        <div id="session-detail" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);"></div>
      </div>
    </div>
  </div>

</div>

<script>
let sessionId = null;

// ===== Progress Bar 管理器 =====
class ProgressBar {
  constructor(fillId, textId, stepsId) {
    this.fillEl = document.getElementById(fillId);
    this.textEl = document.getElementById(textId);
    this.stepsEl = document.getElementById(stepsId);
    this._timer = null;
    this._pct = 0;
    this._target = 0;
    this._stages = [];
  }

  start(stages) {
    this._stages = stages;
    this._pct = 0;
    this._target = 0;
    this.fillEl.style.width = '0%';
    this.textEl.textContent = stages[0] || '正在准备...';
    if (this.stepsEl) {
      this.stepsEl.innerHTML = stages.map((s, i) =>
        `<span class="progress-step${i === 0 ? ' active' : ''}">${s}</span>`
      ).join('');
    }
    this._advance();
  }

  _advance() {
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      if (this._pct < this._target) {
        this._pct += 1;
        this.fillEl.style.width = this._pct + '%';
        // 更新阶段文字
        const stageIdx = Math.min(
          Math.floor(this._pct / (100 / this._stages.length)),
          this._stages.length - 1
        );
        this.textEl.textContent = this._stages[stageIdx] + '...';
        if (this.stepsEl) {
          const steps = this.stepsEl.children;
          for (let i = 0; i < steps.length; i++) {
            steps[i].className = 'progress-step' +
              (i < stageIdx ? ' done' : i === stageIdx ? ' active' : '');
          }
        }
        this._advance();
      }
    }, 50);
  }

  setTarget(pct, stageIdx) {
    this._target = Math.min(pct, 95); // 最多到95%，留给完成时跳到100%
    if (stageIdx !== undefined && this._stages[stageIdx]) {
      // 不强制立即更新文字，让 _advance 自然过渡
    }
    if (this._pct < this._target) this._advance();
  }

  finish(msg) {
    if (this._timer) clearTimeout(this._timer);
    this._pct = 100;
    this._target = 100;
    this.fillEl.style.width = '100%';
    this.textEl.textContent = msg || '完成!';
    if (this.stepsEl) {
      const steps = this.stepsEl.children;
      for (let i = 0; i < steps.length; i++) {
        steps[i].className = 'progress-step done';
      }
    }
  }

  fail(msg) {
    if (this._timer) clearTimeout(this._timer);
    this.fillEl.style.width = '100%';
    this.fillEl.style.background = 'var(--red)';
    this.textEl.textContent = msg || '出错了';
  }

  destroy() {
    if (this._timer) clearTimeout(this._timer);
    this.fillEl.style.background = '';
    this.fillEl.style.width = '0%';
    if (this.stepsEl) this.stepsEl.innerHTML = '';
  }
}

const interviewProgress = new ProgressBar('progress-fill', 'loading-text', 'progress-steps');
const learnProgress = new ProgressBar('learn-progress-fill', 'learn-loading-text', null);

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.nav-tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById('tab-learn').style.display = tab === 'learn' ? 'block' : 'none';
  document.getElementById('tab-interview').style.display = tab === 'interview' ? 'block' : 'none';
  document.getElementById('tab-review').style.display = tab === 'review' ? 'block' : 'none';
  if (tab === 'interview' || tab === 'learn') initDefault();
  if (tab === 'review') loadReview();
  if (tab === 'learn') document.getElementById('learn-input').focus();
}

// === 学习模式 ===

async function learnAsk() {
  const q = document.getElementById('learn-input').value.trim();
  if (!q) { alert('请输入问题'); return; }

  document.getElementById('learn-loading').style.display = 'block';
  document.getElementById('learn-result').style.display = 'none';
  learnProgress.start(['检索中', '分析中', '生成回答']);
  // 模拟阶段推进
  setTimeout(() => learnProgress.setTarget(30, 0), 200);
  setTimeout(() => learnProgress.setTarget(60, 1), 600);

  try {
    const resp = await fetch('/api/learn/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const data = await resp.json();

    learnProgress.finish('✅ 完成');
    setTimeout(() => {
      document.getElementById('learn-loading').style.display = 'none';
      learnProgress.destroy();
    }, 400);

    document.getElementById('learn-q').textContent = data.question;
    document.getElementById('learn-a').textContent = data.answer;
    document.getElementById('learn-category').textContent = '📂 ' + (data.category || '通用');
    document.getElementById('learn-speed').textContent = '⚡ ' + data.elapsed_ms + 'ms';
    
    const layerMap = {0:'缓存命中',1:'精确匹配',2:'语义检索',3:'预置回答',4:'DeepSeek生成'};
    document.getElementById('learn-source').textContent = '🔗 ' + (layerMap[data.layer] || '其他');

    // 置信度标签 + AI生成提示
    if (data.note) {
      // 在答案上方显示提示
      document.getElementById('learn-a').innerHTML = '<div style="background:var(--border);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--orange);">⚠️ ' + data.note + '</div>' + data.answer;
    }
    let confHtml = '';
    if (data.confidence === 'low') {
      confHtml = ' <span style="color:var(--orange);font-size:12px;">⚠️ 仅供参考（未找到精确匹配，这是语义最接近的）</span>';
    } else if (data.confidence === 'medium') {
      confHtml = ' <span style="color:var(--text-muted);font-size:12px;">💡 部分匹配</span>';
    }
    document.getElementById('learn-speed').innerHTML = '⚡ ' + data.elapsed_ms + 'ms' + confHtml;

    // 话题标签
    let topicHtml = '';
    if (data.topic) {
      // 先清掉隐藏的topic标签，直接在category位置显示
      document.getElementById('learn-category').textContent = '📂 ' + (data.category || '') + ' · 🏷️ ' + data.topic;
    }

    // 相关问题
    if (data.related && data.related.length > 0) {
      document.getElementById('learn-followup').style.display = 'block';
      const followupTitle = document.querySelector('#learn-followup .card-title');
      if (followupTitle) followupTitle.textContent = '🔍 相关问题';
      document.getElementById('learn-related').innerHTML = data.related.map(r =>
        `<div class="history-item" style="cursor:pointer;" onclick="quickAsk('${r.question.replace(/'/g, "\\'")}')">
          <div style="color:var(--accent);font-size:14px;">${r.question}</div>
        </div>`
      ).join('');
    } else if (data.layer >= 2 && data.matched_question && data.matched_question !== data.question) {
      document.getElementById('learn-followup').style.display = 'block';
      const followupTitle = document.querySelector('#learn-followup .card-title');
      if (followupTitle) followupTitle.textContent = '🔍 相关问题';
      document.getElementById('learn-related').innerHTML = `
        <div class="history-item" style="cursor:pointer;" onclick="quickAsk('${data.matched_question.replace(/'/g, "\\'")}')">
          <div style="color:var(--accent);font-size:14px;">${data.matched_question}</div>
        </div>`;
    } else {
      document.getElementById('learn-followup').style.display = 'none';
    }
  } catch (e) {
    learnProgress.fail('❌ 请求失败');
    setTimeout(() => {
      document.getElementById('learn-loading').style.display = 'none';
      learnProgress.destroy();
    }, 800);
    document.getElementById('learn-result').style.display = 'block';
    document.getElementById('learn-q').textContent = q;
    document.getElementById('learn-a').textContent = '❌ 请求失败: ' + e.message;
    document.getElementById('learn-speed').textContent = '';
    document.getElementById('learn-category').textContent = '';
    document.getElementById('learn-source').textContent = '';
  }
}

function quickAsk(q) {
  document.getElementById('learn-input').value = q;
  learnAsk();
}

// Enter键提问
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('tab-learn').style.display !== 'none' && document.activeElement === document.getElementById('learn-input')) {
    learnAsk();
  }
});

// Initial state
function initDefault() {
  if (document.getElementById('tab-learn').style.display === 'block' || 
      document.getElementById('tab-interview').style.display === 'block') {
    // nothing needed
  }
}
initDefault();

// ===== Chat helpers =====
function addChatBubble(role, sender, content) {
  const chat = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + role;
  div.innerHTML = '<div class="sender">' + esc(sender) + '</div><div>' + esc(content) + '</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addChatSystemMsg(msg) {
  const chat = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-system-msg';
  div.textContent = msg;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== Interview Chat =====
let _chatSending = false;

async function startInterview() {
  const focus = document.getElementById('job-focus').value.trim();
  document.getElementById('loading').style.display = 'block';
  document.getElementById('setup-section').style.display = 'none';
  document.getElementById('interview-chat').style.display = 'none';

  interviewProgress.start(['加载简历', '匹配岗位', '检索知识库', 'AI生成面试题']);
  setTimeout(() => interviewProgress.setTarget(15, 0), 300);
  setTimeout(() => interviewProgress.setTarget(35, 1), 800);
  setTimeout(() => interviewProgress.setTarget(60, 2), 1500);
  setTimeout(() => interviewProgress.setTarget(85, 3), 2500);

  try {
    const resp = await fetch('/api/interview/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({job_focus: focus})
    });
    const data = await resp.json();
    sessionId = data.session_id;

    if (data.job_context) {
      const ctx = document.getElementById('job-context');
      ctx.innerHTML = '📌 匹配到的岗位：<br>' + data.job_context.replace(/\n/g, '<br>');
      ctx.style.display = 'block';
    }

    interviewProgress.finish('✅ 面试已就绪');
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      interviewProgress.destroy();
      // 显示聊天界面
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('interview-chat').style.display = 'block';
      addChatBubble('interviewer', '🤖 面试官', data.message);
      document.getElementById('chat-input').focus();
    }, 500);
  } catch (e) {
    interviewProgress.fail('❌ 启动失败');
    setTimeout(() => {
      alert('启动面试失败: ' + e.message);
      document.getElementById('loading').style.display = 'none';
      interviewProgress.destroy();
      document.getElementById('setup-section').style.display = 'block';
    }, 600);
  }
}

async function sendMessage() {
  if (!sessionId || _chatSending) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  _chatSending = true;
  input.disabled = true;
  document.getElementById('chat-send-btn').disabled = true;

  // 显示用户消息
  addChatBubble('user', '👤 你', msg);
  input.value = '';
  input.style.height = 'auto';

  // 加载状态
  addChatSystemMsg('面试官正在输入...');
  const loadingMsg = document.getElementById('chat-messages').lastElementChild;

  try {
    const resp = await fetch('/api/interview/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: msg})
    });
    const data = await resp.json();
    // 移除加载状态
    if (loadingMsg && loadingMsg.className === 'chat-system-msg') loadingMsg.remove();

    addChatBubble('interviewer', '🤖 面试官', data.reply);

    if (data.want_to_end) {
      addChatSystemMsg('面试官已结束本次面试');
      document.getElementById('chat-input').style.display = 'none';
      document.getElementById('chat-send-btn').style.display = 'none';
    }
  } catch (e) {
    if (loadingMsg && loadingMsg.className === 'chat-system-msg') loadingMsg.remove();
    addChatSystemMsg('❌ 发送失败: ' + e.message);
  }

  _chatSending = false;
  input.disabled = false;
  document.getElementById('chat-send-btn').disabled = false;
  input.focus();
}

async function endInterview() {
  if (!sessionId) return;
  if (!confirm('确定结束本次面试？')) return;

  document.getElementById('chat-input').disabled = true;
  document.getElementById('chat-send-btn').disabled = true;
  addChatSystemMsg('正在生成面试总结...');
  const loadingMsg = document.getElementById('chat-messages').lastElementChild;

  try {
    const resp = await fetch('/api/interview/end', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId})
    });
    const data = await resp.json();
    const s = data.summary;

    if (loadingMsg && loadingMsg.className === 'chat-system-msg') loadingMsg.remove();

    if (s.review) {
      addChatBubble('interviewer', '📊 面试总结', s.review);
    }
    addChatSystemMsg('面试已结束');

    // 小结弹窗
    let summaryText = '面试已结束！';
    if (s.total_questions) summaryText += `\n共 ${s.total_questions} 轮对话`;
    if (s.avg_score) summaryText += ` | 平均分 ${s.avg_score}`;
    if (s.review) summaryText += '\n\n详细总结已显示在上方';
    alert('🎯 ' + summaryText);

    sessionId = null;
    document.getElementById('chat-input').style.display = 'none';
    document.getElementById('chat-send-btn').style.display = 'none';

    // 自动切到回顾页
    setTimeout(() => { switchTab('review'); loadReview(); }, 1000);
  } catch (e) {
    if (loadingMsg && loadingMsg.className === 'chat-system-msg') loadingMsg.remove();
    addChatSystemMsg('❌ 结束面试失败: ' + e.message);
    document.getElementById('chat-input').disabled = false;
    document.getElementById('chat-send-btn').disabled = false;
  }
}

// Load review
async function loadReview() {
  try {
    // 1. Load weak areas (lowest score questions)
    const weakResp = await fetch('/api/review/weak-areas?limit=10');
    const weakData = await weakResp.json();

    // 2. Load all sessions
    const sResp = await fetch('/api/review/sessions');
    const sData = await sResp.json();

    if (!weakData.weak_areas || weakData.weak_areas.length === 0) {
      // Check if there are any sessions at all
      if (!sData.sessions || sData.sessions.length === 0) {
        document.getElementById('review-empty').style.display = 'block';
        document.getElementById('review-content').style.display = 'none';
        return;
      }
    }

    document.getElementById('review-empty').style.display = 'none';
    document.getElementById('review-content').style.display = 'block';

    // ── 总览统计 ──
    let totalQuestions = 0, totalScore = 0, bestScore = 0, worstScore = 10;
    const catScores = {}; // {category: [scores]}
    if (weakData.weak_areas) {
      weakData.weak_areas.forEach(w => {
        totalQuestions++;
        totalScore += w.score;
        if (w.score > bestScore) bestScore = w.score;
        if (w.score < worstScore) worstScore = w.score;
        const cat = w.category || '未分类';
        if (!catScores[cat]) catScores[cat] = [];
        catScores[cat].push(w.score);
      });
    }
    // Also check sessions for total count
    if (sData.sessions && sData.sessions.length > 0) {
      const detailResp = await fetch('/api/review/session/' + sData.sessions[0]);
      const detail = await detailResp.json();
      if (detail.total_questions > 0) {
        totalQuestions = detail.total_questions;
        totalScore = detail.avg_score * detail.total_questions;
        bestScore = detail.max_score;
        worstScore = detail.min_score;
        document.getElementById('review-summary').innerHTML = `
          <div class="review-stat"><div class="value">${detail.total_questions}</div><div class="label">总答题数</div></div>
          <div class="review-stat"><div class="value score-${scoreClass(detail.avg_score)}">${detail.avg_score}</div><div class="label">平均分</div></div>
          <div class="review-stat"><div class="value">${detail.min_score}</div><div class="label">最低分</div></div>
          <div class="review-stat"><div class="value">${detail.max_score}</div><div class="label">最高分</div></div>
          <div class="review-stat"><div class="value">${sData.sessions.length}</div><div class="label">面试次数</div></div>`;
      } else {
        document.getElementById('review-summary').innerHTML = `
          <div class="review-stat"><div class="value">${totalQuestions}</div><div class="label">总答题数</div></div>
          <div class="review-stat"><div class="value">${sData.sessions.length}</div><div class="label">面试次数</div></div>`;
      }
    }

    // ── 类别表现 & 权重 ──
    const catNames = ['编程语言', '数据库', '系统设计', '工程化', '前端', 'AI/ML', '数据处理', '安全'];
    const defaultWeights = {'编程语言':0.17, '数据库':0.15, '系统设计':0.17, '工程化':0.14, '前端':0.11, 'AI/ML':0.10, '数据处理':0.08, '安全':0.08};
    const breakdown = document.getElementById('category-breakdown');
    breakdown.innerHTML = catNames.map(cat => {
      const scores = catScores[cat] || [];
      const avg = scores.length > 0 ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : null;
      const count = scores.length;
      const dw = defaultWeights[cat];
      // Simulate dynamic weight adjustment (same logic as engine.py)
      let adjW = dw;
      if (avg !== null) {
        if (avg < 5) adjW = dw * 2.0;
        else if (avg < 6) adjW = dw * 1.5;
        else if (avg < 7) adjW = dw * 1.0;
        else adjW = dw * 0.7;
      }
      const totalAdj = catNames.reduce((s, c) => {
        const a = catScores[c] && catScores[c].length > 0 ?
          (catScores[c].reduce((x,y)=>x+y,0)/catScores[c].length) : null;
        let aw = defaultWeights[c];
        if (a !== null) {
          if (a < 5) aw = defaultWeights[c] * 2.0;
          else if (a < 6) aw = defaultWeights[c] * 1.5;
          else if (a < 7) aw = defaultWeights[c] * 1.0;
          else aw = defaultWeights[c] * 0.7;
        }
        return s + aw;
      }, 0);
      const finalW = totalAdj > 0 ? (adjW / totalAdj * 100) : (dw * 100);
      const barW = Math.max(5, finalW);
      const barColor = finalW > 30 ? 'var(--red)' : finalW > 25 ? 'var(--orange)' : finalW > 15 ? 'var(--accent)' : 'var(--green)';

      return `<div style="display:flex;align-items:center;gap:12px;">
        <span style="width:70px;font-size:13px;font-weight:500;" class="tag ${getCategoryClass(cat)}">${cat}</span>
        <span style="width:50px;font-size:13px;color:var(--text-muted);text-align:right;">${avg || '--'}分</span>
        <span style="font-size:12px;color:var(--text-muted);width:40px;text-align:right;">${count}题</span>
        <div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${barW}%;background:${barColor};border-radius:4px;transition:width 0.5s;"></div>
        </div>
        <span style="width:55px;font-size:12px;color:var(--text-muted);text-align:right;">${finalW.toFixed(0)}%</span>
      </div>`;
    }).join('');

    // ── 薄弱题目列表 ──
    const weakEl = document.getElementById('weak-list');
    if (weakData.weak_areas && weakData.weak_areas.length > 0) {
      weakEl.innerHTML = weakData.weak_areas.slice(0, 5).map(w => {
        const cls = w.score >= 7 ? 'score-high' : w.score >= 5 ? 'score-mid' : 'score-low';
        const catTag = w.category ? `<span class="tag ${getCategoryClass(w.category)}">${w.category}</span>` : '';
        return `<div class="history-item">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div class="q" style="flex:1;">❓ ${esc(w.question).substring(0, 100)}</div>
            ${catTag}
            <span class="${cls}" style="font-size:16px;font-weight:700;">${w.score}</span>
          </div>
          <div class="s">${w.feedback ? esc(w.feedback).substring(0, 150) : ''}</div>
        </div>`;
      }).join('');
      document.getElementById('weak-areas').style.display = 'block';
    } else {
      document.getElementById('weak-areas').style.display = 'none';
    }

    // ── 历史会话列表 ──
    const sessionsEl = document.getElementById('sessions-list');
    if (sData.sessions && sData.sessions.length > 0) {
      sessionsEl.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">' +
        sData.sessions.slice(0, 20).map((sid, i) =>
          `<button class="btn btn-secondary btn-sm" onclick="loadSessionDetail('${sid}')" id="sess-btn-${sid}">
            📋 ${sid.substring(0, 8)}...
          </button>`
        ).join('') + '</div>';
    } else {
      sessionsEl.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">暂无历史会话</p>';
    }

  } catch (e) {
    console.error('加载回顾失败:', e);
    document.getElementById('review-empty').style.display = 'block';
    document.getElementById('review-empty').innerHTML = '<div class="icon">⚠️</div><p>加载失败: ' + e.message + '</p>';
  }
}

async function loadSessionDetail(sessionId) {
  // Highlight active button
  document.querySelectorAll('#sessions-list button').forEach(b => b.classList.remove('btn-primary'));
  const btn = document.getElementById('sess-btn-' + sessionId);
  if (btn) btn.className = 'btn btn-primary btn-sm';

  const detailEl = document.getElementById('session-detail');
  try {
    const resp = await fetch('/api/review/session/' + sessionId);
    const detail = await resp.json();
    if (detail.total_questions > 0) {
      detailEl.style.display = 'block';
      detailEl.innerHTML = `
        <div class="card-title">📋 会话 ${sessionId.substring(0, 12)}... — ${detail.total_questions} 题，均分 ${detail.avg_score}</div>
        <div class="review-summary" style="margin-bottom:12px;">
          <div class="review-stat"><div class="value">${detail.total_questions}</div><div class="label">题目数</div></div>
          <div class="review-stat"><div class="value score-${scoreClass(detail.avg_score)}">${detail.avg_score}</div><div class="label">平均分</div></div>
          <div class="review-stat"><div class="value">${detail.min_score}</div><div class="label">最低</div></div>
          <div class="review-stat"><div class="value">${detail.max_score}</div><div class="label">最高</div></div>
        </div>
        ${(detail.records || []).map(r => {
          const cls = r.score >= 7 ? 'score-high' : r.score >= 5 ? 'score-mid' : 'score-low';
          const catTag = r.category ? `<span class="tag ${getCategoryClass(r.category)}" style="font-size:11px;">${r.category}</span>` : '';
          return `<div class="history-item">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;">
              <div style="flex:1;font-size:13px;">${esc(r.question || '').substring(0, 120)}</div>
              ${catTag}
              <span class="${cls}" style="font-weight:700;">${r.score}</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted);">💬 ${esc(r.user_answer || '').substring(0, 100)}</div>
            ${r.feedback ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">📝 ${esc(r.feedback).substring(0, 150)}</div>` : ''}
          </div>`;
        }).join('')}
      `;
    } else {
      detailEl.style.display = 'block';
      detailEl.innerHTML = '<p style="color:var(--text-muted);">该会话暂无详细记录</p>';
    }
  } catch (e) {
    detailEl.style.display = 'block';
    detailEl.innerHTML = '<p style="color:var(--red);">加载失败: ' + e.message + '</p>';
  }
}

function scoreClass(score) {
  if (score >= 7) return 'high';
  if (score >= 5) return 'mid';
  return 'low';
}

function getCategoryClass(cat) {
  const map = {
    '编程语言': 'tag-lang',
    '数据库': 'tag-db',
    '系统设计': 'tag-sys',
    '工程化': 'tag-eng',
    '前端': 'tag-fe',
    'AI/ML': 'tag-ai',
    '数据处理': 'tag-data',
    '安全': 'tag-sec'
  };
  return map[cat] || 'tag-eng';
}
